<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Strikepad 管理ツール - ログイン</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.7.2/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #6f42c1 0%, #e83e8c 100%);
            min-height: 100vh;
        }

        .login-card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border: none;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.1);
        }

        .btn-primary {
            background: linear-gradient(135deg, #6f42c1 0%, #e83e8c 100%);
            border: none;
        }

        .btn-primary:hover {
            background: linear-gradient(135deg, #5a32a3 0%, #d63384 100%);
            transform: translateY(-1px);
        }
    </style>
</head>
<body class="d-flex align-items-center justify-content-center">
<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-4">
            <div class="card login-card">
                <div class="card-body p-4">
                    <!-- Header -->
                    <div class="text-center mb-4">
                        <i class="bi bi-shield-lock text-primary fs-1"></i>
                        <h3 class="card-title mt-2 mb-1">管理ツール</h3>
                        <p class="text-muted">Strikepad Management Console</p>
                    </div>

                    <!-- Error Alert -->
                    {{if .Error}}
                    <div class="alert alert-danger d-flex align-items-center" role="alert">
                        <i class="bi bi-exclamation-triangle-fill me-2"></i>
                        <div>{{.Error}}</div>
                    </div>
                    {{end}}

                    <!-- Login Form -->
                    <form method="POST" action="/auth/login" id="loginForm">
                        <div class="mb-3">
                            <label for="login_id" class="form-label">
                                <i class="bi bi-person me-1"></i>ログインID
                            </label>
                            <input type="text" class="form-control" id="login_id" name="login_id" required
                                   autocomplete="username">
                        </div>

                        <div class="mb-3">
                            <label for="password" class="form-label">
                                <i class="bi bi-lock me-1"></i>パスワード
                            </label>
                            <input type="password" class="form-control" id="password" name="password" required
                                   autocomplete="current-password">
                        </div>

                        <div class="d-grid">
                            <button type="submit" class="btn btn-primary btn-lg" id="loginButton">
                                <span id="loginButtonText">
                                    <i class="bi bi-box-arrow-in-right me-2"></i>ログイン
                                </span>
                                <span id="loginButtonSpinner" class="d-none">
                                    <span class="spinner-border spinner-border-sm me-2" role="status"
                                          aria-hidden="true"></span>
                                    処理中...
                                </span>
                            </button>
                        </div>
                    </form>

                    <!-- Footer -->
                    <div class="text-center mt-4">
                        <small class="text-muted">
                            &copy; 2024 Strikepad Management Tool
                        </small>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- Bootstrap 5 JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

<script>
    document.addEventListener('DOMContentLoaded', function () {
        const loginForm = document.getElementById('loginForm');
        const loginButton = document.getElementById('loginButton');
        const loginButtonText = document.getElementById('loginButtonText');
        const loginButtonSpinner = document.getElementById('loginButtonSpinner');
        const loginIdInput = document.getElementById('login_id');
        const passwordInput = document.getElementById('password');

        // フォーム送信処理
        loginForm.addEventListener('submit', function (e) {
            // 入力値の検証
            const loginId = loginIdInput.value.trim();
            const password = passwordInput.value.trim();

            if (!loginId || !password) {
                e.preventDefault();
                showError('ログインIDとパスワードを入力してください');
                return;
            }

            // ボタンを無効化して処理中状態にする
            loginButton.disabled = true;
            loginButtonText.classList.add('d-none');
            loginButtonSpinner.classList.remove('d-none');
        });

        // エラー表示関数
        function showError(message) {
            // 既存のエラーアラートを削除
            const existingAlert = document.querySelector('.alert-danger');
            if (existingAlert) {
                existingAlert.remove();
            }

            // 新しいエラーアラートを作成
            const errorAlert = document.createElement('div');
            errorAlert.className = 'alert alert-danger d-flex align-items-center';
            errorAlert.setAttribute('role', 'alert');
            errorAlert.innerHTML = `
            <i class="bi bi-exclamation-triangle-fill me-2"></i>
            <div>${message}</div>
        `;

            // フォームの前に挿入
            loginForm.parentNode.insertBefore(errorAlert, loginForm);

            // ボタンの状態をリセット
            resetButton();
        }

        // ボタン状態リセット関数
        function resetButton() {
            loginButton.disabled = false;
            loginButtonText.classList.remove('d-none');
            loginButtonSpinner.classList.add('d-none');
        }

        // パスワードフィールドでEnterキーを押したときの処理
        passwordInput.addEventListener('keypress', function (e) {
            if (e.key === 'Enter') {
                loginForm.submit();
            }
        });

        // ログインIDフィールドでEnterキーを押したときの処理
        loginIdInput.addEventListener('keypress', function (e) {
            if (e.key === 'Enter') {
                passwordInput.focus();
            }
        });

        // ページロード時にログインIDフィールドにフォーカス
        loginIdInput.focus();
    });
</script>
</body>
</html>
