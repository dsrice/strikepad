<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Strikepad 管理ツール - ダッシュボード</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.7.2/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        body {
            background-color: #f8f9fa;
        }

        .stat-card {
            border: none;
            box-shadow: 0 0.125rem 0.25rem rgba(0, 0, 0, 0.075);
            transition: transform 0.2s ease;
        }

        .stat-card:hover {
            transform: translateY(-2px);
        }

        .stat-value {
            font-size: 2.5rem;
            font-weight: 700;
        }

        .action-card {
            border: none;
            background: linear-gradient(135deg, #6f42c1 0%, #e83e8c 100%);
            color: white;
            transition: transform 0.2s ease;
        }

        .action-card:hover {
            transform: translateY(-2px);
            text-decoration: none;
            color: white;
        }

        .navbar-brand {
            font-weight: 600;
        }
    </style>
</head>
<body>
<!-- Navigation -->
<nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow-sm">
    <div class="container-fluid">
        <a class="navbar-brand" href="/dashboard">
            <i class="bi bi-shield-lock me-2"></i>Strikepad 管理ツール
        </a>
        <div class="navbar-nav ms-auto">
            <div class="nav-item dropdown">
                <a class="nav-link dropdown-toggle" href="#" role="button" data-bs-toggle="dropdown">
                    <i class="bi bi-person-circle me-1"></i>{{.Username}}
                </a>
                <ul class="dropdown-menu">
                    <li><a class="dropdown-item" href="/admin/profile">
                        <i class="bi bi-person me-2"></i>プロフィール
                    </a></li>
                    <li>
                        <hr class="dropdown-divider">
                    </li>
                    <li><a class="dropdown-item" href="/logout">
                        <i class="bi bi-box-arrow-right me-2"></i>ログアウト
                    </a></li>
                </ul>
            </div>
        </div>
    </div>
</nav>

<!-- Main Content -->
<div class="container-fluid mt-4">
    <!-- Welcome Section -->
    <div class="row mb-4">
        <div class="col-12">
            <div class="card">
                <div class="card-body">
                    <h2 class="card-title">
                        <i class="bi bi-speedometer2 text-primary me-2"></i>ダッシュボード
                    </h2>
                    <p class="card-text">こんにちは、{{.Username}}さん。Strikepad管理ツールへようこそ。</p>
                </div>
            </div>
        </div>
    </div>

    <!-- Statistics Cards -->
    <div class="row mb-4">
        <div class="col-md-4 mb-3">
            <div class="card stat-card">
                <div class="card-body text-center">
                    <i class="bi bi-people text-primary fs-1"></i>
                    <h5 class="card-title mt-3 text-muted">総ユーザー数</h5>
                    <div class="stat-value text-primary">{{.Stats.TotalUsers}}</div>
                </div>
            </div>
        </div>
        <div class="col-md-4 mb-3">
            <div class="card stat-card">
                <div class="card-body text-center">
                    <i class="bi bi-activity text-success fs-1"></i>
                    <h5 class="card-title mt-3 text-muted">アクティブセッション</h5>
                    <div class="stat-value text-success">{{.Stats.ActiveSessions}}</div>
                </div>
            </div>
        </div>
        <div class="col-md-4 mb-3">
            <div class="card stat-card">
                <div class="card-body text-center">
                    <i class="bi bi-calendar-day text-info fs-1"></i>
                    <h5 class="card-title mt-3 text-muted">今日のログイン</h5>
                    <div class="stat-value text-info">{{.Stats.TodayLogins}}</div>
                </div>
            </div>
        </div>
    </div>

    <!-- Management Actions -->
    <div class="row">
        <div class="col-12">
            <div class="card">
                <div class="card-header">
                    <h5 class="mb-0">
                        <i class="bi bi-gear me-2"></i>管理機能
                    </h5>
                </div>
                <div class="card-body">
                    <div class="row">
                        <div class="col-md-3 mb-3">
                            <a href="/admin/users" class="card action-card text-decoration-none">
                                <div class="card-body text-center">
                                    <i class="bi bi-people fs-2"></i>
                                    <h6 class="mt-2">ユーザー管理</h6>
                                </div>
                            </a>
                        </div>
                        <div class="col-md-3 mb-3">
                            <a href="/admin/sessions" class="card action-card text-decoration-none">
                                <div class="card-body text-center">
                                    <i class="bi bi-clock-history fs-2"></i>
                                    <h6 class="mt-2">セッション管理</h6>
                                </div>
                            </a>
                        </div>
                        <div class="col-md-3 mb-3">
                            <a href="/admin/logs" class="card action-card text-decoration-none">
                                <div class="card-body text-center">
                                    <i class="bi bi-file-text fs-2"></i>
                                    <h6 class="mt-2">ログ確認</h6>
                                </div>
                            </a>
                        </div>
                        <div class="col-md-3 mb-3">
                            <a href="/admin/settings" class="card action-card text-decoration-none">
                                <div class="card-body text-center">
                                    <i class="bi bi-gear fs-2"></i>
                                    <h6 class="mt-2">設定</h6>
                                </div>
                            </a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- Bootstrap 5 JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
